
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kafe Takip Paneli (Özel Masa İsimli)</title>
  
  <!-- Canlı Eşitleme Kütüphanesi -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* ŞİFRE GİRİŞ OVERLAY */
    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #181825;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-box {
      background: #2b2b3d;
      border: 1px solid #45475a;
      border-radius: 16px;
      padding: 30px;
      width: 340px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .login-box h3 {
      margin: 0;
      color: #89b4fa;
      font-size: 20px;
    }

    .login-input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #181825;
      color: #a6e3a1;
      font-weight: bold;
    }

    .login-btn {
      background: #89b4fa;
      color: #11111b;
      font-size: 14px;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .login-error {
      color: #f38ba8;
      font-size: 12px;
      min-height: 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .top-bar {
      background: #2b2b3d;
      padding: 15px 25px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #45475a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      flex-wrap: wrap;
      gap: 10px;
    }

    .turnover-badge {
      background: #181825;
      border: 2px solid #a6e3a1;
      padding: 8px 16px;
      border-radius: 8px;
      color: #a6e3a1;
      font-weight: bold;
      font-size: 18px;
    }

    .status-badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      background: #f38ba8;
      color: #11111b;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .actions-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .layout {
      display: flex;
      gap: 20px;
      width: 100%;
    }

    .section-panel {
      flex: 1;
      background: #2b2b3d;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #45475a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #89b4fa;
      border-bottom: 2px solid #45475a;
      padding-bottom: 8px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .table-box {
      background: #45475a;
      color: #cdd6f4;
      padding: 20px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .table-box:hover {
      background: #585b70;
      transform: translateY(-2px);
    }

    .table-box.has-orders {
      background: #89b4fa;
      color: #11111b;
    }

    .table-box .badge {
      font-size: 11px;
      background: #11111b;
      color: #a6e3a1;
      padding: 3px 6px;
      border-radius: 5px;
    }

    /* Modal (Masa Ekranı) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: #2b2b3d;
      border: 1px solid #45475a;
      width: 900px;
      max-width: 95%;
      border-radius: 14px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #45475a;
      padding-bottom: 10px;
    }

    .modal-grid {
      display: flex;
      gap: 20px;
    }

    .modal-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-col-right {
      border-left: 1px solid #45475a;
      padding-left: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 3px 0;
      border: 1px solid #45475a;
      background: #181825;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .form-group { display: flex; gap: 8px; }

    .item-list {
      max-height: 160px;
      overflow-y: auto;
      background: #181825;
      border-radius: 8px;
      padding: 10px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 8px 10px;
      background: #2b2b3d;
      border-radius: 6px;
      font-size: 13px;
    }

    .delete-btn {
      background: #f38ba8;
      color: #11111b;
      padding: 3px 6px;
      font-size: 11px;
      border-radius: 4px;
      margin-left: 8px;
    }

    .payment-title {
      font-size: 12px;
      color: #a6adc8;
      margin: 6px 0 4px 0;
    }

    .payment-btn-group { display: flex; gap: 8px; }

    .pay-btn {
      flex: 1;
      padding: 10px 4px;
      font-size: 12px;
      border-radius: 8px;
      color: #11111b;
      text-align: center;
    }

    .pay-btn.cash { background: #a6e3a1; }
    .pay-btn.card { background: #89b4fa; }
    .pay-btn.meal { background: #f9e2af; }

    .clear-btn { background: #f38ba8; color: #11111b; width: 100%; margin-top: 4px; }
    .close-btn { background: #f38ba8; color: #11111b; padding: 6px 12px; }
    .history-toggle-btn { background: #cba6f7; color: #11111b; }
    .reset-cari-btn { background: #fab387; color: #11111b; }
    .lock-btn { background: #f38ba8; color: #11111b; }

    .gunu-topla-btn {
      background: #a6e3a1;
      color: #11111b;
      font-size: 16px;
      padding: 16px 28px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      border: 2px solid #a6e3a1;
      box-shadow: 0 4px 15px rgba(166, 227, 161, 0.2);
      transition: all 0.2s ease;
    }

    .gunu-topla-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(166, 227, 161, 0.3);
    }

    /* HIZLI SATIŞ BUTONLARI */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding: 4px;
    }

    .quick-card {
      background: #181825;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .quick-card:hover {
      background: #313244;
      border-color: #a6e3a1;
      transform: translateY(-2px);
    }

    .quick-card-name {
      font-size: 14px;
      font-weight: bold;
      color: #cdd6f4;
    }

    .quick-card-price {
      font-size: 13px;
      color: #a6e3a1;
      font-weight: bold;
    }

    .quick-card-del {
      position: absolute;
      top: 2px;
      right: 5px;
      color: #f38ba8;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      opacity: 0.6;
    }

    .quick-card-del:hover { opacity: 1; }

    /* SAĞ AÇILIR PANEL */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      max-width: 88vw;
      height: 100vh;
      background: #2b2b3d;
      border-left: 1px solid #45475a;
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      z-index: 1002;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .drawer.active { right: 0; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #45475a;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .drawer-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .reset-history-btn {
      background: #f38ba8;
      color: #11111b;
      width: 100%;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-card {
      background: #181825;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-card-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #89b4fa;
      font-weight: bold;
    }

    .history-card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-card-time { font-size: 12px; color: #a6adc8; }

    .method-badge {
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      color: #11111b;
    }

    .method-Nakit { background: #a6e3a1; }
    .method-KrediKartı { background: #89b4fa; }
    .method-YemekKartı { background: #f9e2af; }

    @media (max-width: 768px) {
      .modal-grid { flex-direction: column; }
      .modal-col-right { border-left: none; border-top: 1px solid #45475a; padding-left: 0; padding-top: 15px; }
      .layout { flex-direction: column; }
      .payment-btn-group { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- ŞİFRE EKRANI (LOGIN OVERLAY) -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-box">
      <h3>🔒 Sistem Şifresi Girişi</h3>
      <input type="password" id="login-passcode" class="login-input" placeholder="••••" maxlength="10" onkeyup="if(event.key==='Enter') checkPassword()">
      <div id="login-error" class="login-error"></div>
      <button class="login-btn" onclick="checkPassword()">Giriş Yap</button>
    </div>
  </div>

  <!-- Ana Panel -->
  <div id="main-content" class="wrapper hidden">
    
    <div class="top-bar">
      <h2 style="margin:0;">☕ Demlik Kafe Takip</h2>
      <div id="connection-status" class="status-badge">🟡 BAĞLANIYOR...</div>
      <div class="turnover-badge">GÜNLÜK CİRO: <span id="daily-turnover">0 TL</span></div>
      <div class="actions-bar">
        <button class="history-toggle-btn" onclick="toggleDrawer(true)">📜 Satış Geçmişi</button>
        <button class="reset-cari-btn" onclick="resetCari()">🔄 Cariyi Sıfırla</button>
        <button class="lock-btn" onclick="lockApp()">🔒 Çıkış</button>
      </div>
    </div>

    <!-- Masalar -->
    <div class="layout">
      <div class="section-panel">
        <div class="section-title">Masa Takip Bölümü</div>
        <div id="grid-left" class="grid"></div>
      </div>

      <div class="section-panel">
        <div id="right-section-title" class="section-title">Sipariş Bölümü</div>
        <div id="grid-right" class="grid"></div>
      </div>
    </div>

    <!-- En Alt Bölüm: Günü Topla Butonu -->
    <div style="margin-top: 40px; margin-bottom: 15px;">
      <button class="gunu-topla-btn" onclick="exportDailySummaryExcel()">📅 GÜNÜ TOPLA</button>
    </div>

  </div>

  <!-- SAĞ AÇILIR SATIŞ GEÇMİŞİ PANELİ -->
  <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer(false)"></div>
  <div id="side-drawer" class="drawer">
    <div class="drawer-header">
      <h3 style="margin:0; color:#cba6f7;">📜 Satış Günlüğü</h3>
      <button class="close-btn" onclick="toggleDrawer(false)">✕</button>
    </div>

    <div class="drawer-actions">
      <button class="reset-history-btn" onclick="resetHistory()">🗑️ Günlüğü Sıfırla</button>
    </div>

    <div id="drawer-history-list" class="history-list"></div>
  </div>

  <!-- Sipariş & Hızlı Menü Modalı -->
  <div id="order-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title" style="margin: 0; color: #89b4fa; font-size: 20px;">Masa Siparişleri</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-grid">
        <!-- SOL KOLON -->
        <div class="modal-col">
          <div>
            <h4 style="margin: 0 0 6px 0; font-size: 13px; color: #a6adc8;">➕ Manuel Sipariş Ekle</h4>
            <input type="text" id="item-name" placeholder="Ürün Adı (Örn: Özel Tatlı)">
            <div class="form-group">
              <input type="number" id="item-count" placeholder="Adet" value="1" min="1">
              <input type="number" id="item-price" placeholder="Fiyat (TL)" min="0">
            </div>
            <button onclick="addItem()" style="width: 100%; background: #89b4fa; color: #11111b; margin-top: 4px;">Masaya Ekle</button>
          </div>

          <h4 style="margin: 4px 0 0 0; font-size: 13px; color: #a6adc8;">📋 Aktif Masa Adisyonu</h4>
          <div id="modal-item-list" class="item-list"></div>

          <div style="text-align: right; font-weight: bold; font-size: 18px; color: #a6e3a1;" id="modal-total">Toplam: 0 TL</div>

          <div>
            <div class="payment-title">💰 Ödeme Yöntemi Seç & Kapat:</div>
            <div class="payment-btn-group">
              <button class="pay-btn cash" onclick="completeSale('Nakit')">💵 Nakit</button>
              <button class="pay-btn card" onclick="completeSale('Kredi Kartı')">💳 Kredi Kartı</button>
              <button class="pay-btn meal" onclick="completeSale('Yemek Kartı')">🎟️ Yemek Kartı</button>
            </div>
            <button class="clear-btn" onclick="clearTable()">🗑️ Masayı İptal Et / Sıfırla</button>
          </div>
        </div>

        <!-- SAĞ KOLON: HIZLI SATIŞ MENÜSÜ -->
        <div class="modal-col modal-col-right">
          <div>
            <h4 style="margin: 0 0 6px 0; font-size: 13px; color: #cba6f7;">⚡ Hızlı Menü Butonu Oluştur</h4>
            <input type="text" id="quick-name" placeholder="Buton Adı (Örn: Çay, Kahve)">
            <input type="number" id="quick-price" placeholder="Fiyatı (TL)" min="0">
            <button onclick="addQuickProduct()" style="width: 100%; background: #cba6f7; color: #11111b; margin-top: 4px;">Menüye Buton Ekle</button>
          </div>

          <h4 style="margin: 6px 0 0 0; font-size: 13px; color: #a6adc8;">👆 Tek Tıkla Masaya Ekle:</h4>
          <div id="quick-product-grid" class="quick-grid"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ---------------------------------------------------------------------
    // 🔑 ŞİFRE AYARI (Varsayılan: 1234)
    // ---------------------------------------------------------------------
    const SYSTEM_PASSWORD = "1234";

    function checkPassword() {
      const inputPass = document.getElementById("login-passcode").value;
      const errorEl = document.getElementById("login-error");

      if (inputPass === SYSTEM_PASSWORD) {
        document.getElementById("login-overlay").classList.add("hidden");
        document.getElementById("main-content").classList.remove("hidden");
        errorEl.innerText = "";
      } else {
        errorEl.innerText = "❌ Hatalı şifre!";
        document.getElementById("login-passcode").value = "";
        document.getElementById("login-passcode").focus();
      }
    }

    function lockApp() {
      document.getElementById("login-passcode").value = "";
      document.getElementById("login-error").innerText = "";
      document.getElementById("main-content").classList.add("hidden");
      document.getElementById("login-overlay").classList.remove("hidden");
    }

    // MASA İSİMLERİ AYARLARI
    const leftTableNames = [
      "Masa 1", "Masa 2", "Masa 3", "Masa 4",
      "Masa 5", "Masa 6", "Masa 7", "Masa 8",
      "Masa 9", "Masa 10", "Masa 11", "Masa 12"
    ];

    const rightTableNames = [
      "Sipariş 1", "Sipariş 2", "Sipariş 3", "Sipariş 4",
      "Sipariş 5", "Sipariş 6", "Sipariş 7", "Sipariş 8",
      "Sipariş 9",   "Sipariş 10",   "Sipariş 11",   "Sipariş 12"
    ];

    const DUKKAN_ID = "kafe_dukkan_v1_9988"; 
    const TOPIC = `kafe_app_data_${DUKKAN_ID}`;

    let dailyTurnover = 0;
    let activeTableKey = null;
    let tables = createEmptyTables();
    let salesHistory = [];
    let quickProducts = [];
    let mqttClient = null;

    function createEmptyTables() {
      const empty = {};
      for (let i = 1; i <= 12; i++) {
        empty[`left_${i}`] = [];
        empty[`right_${i}`] = [];
      }
      return empty;
    }

    function getTableName(key) {
      const parts = key.split('_');
      const prefix = parts[0];
      const index = parseInt(parts[1]) - 1;

      if (prefix === 'left') {
        return leftTableNames[index] || `Masa ${index + 1}`;
      } else {
        return rightTableNames[index] || `Sipariş ${index + 1}`;
      }
    }

    function initApp() {
      const savedTurnover = localStorage.getItem("cafe_turnover");
      const savedTables = localStorage.getItem("cafe_tables");
      const savedHistory = localStorage.getItem("cafe_history");
      const savedQuick = localStorage.getItem("cafe_quick_products");

      if (savedTurnover !== null) dailyTurnover = parseFloat(savedTurnover) || 0;
      if (savedTables) tables = JSON.parse(savedTables);
      if (savedHistory) salesHistory = JSON.parse(savedHistory);
      if (savedQuick) quickProducts = JSON.parse(savedQuick);

      updateTurnoverDisplay();
      renderGrids();
      renderHistoryDrawer();
      connectSyncServer();
    }

    function updateStatus(text, bgColor, textColor = "#11111b") {
      const statusEl = document.getElementById("connection-status");
      statusEl.innerText = text;
      statusEl.style.background = bgColor;
      statusEl.style.color = textColor;
    }

    function connectSyncServer() {
      try {
        const clientId = 'kafe_client_' + Math.random().toString(36).substring(2, 10);

        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
          clientId: clientId,
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 2000
        });

        mqttClient.on('connect', () => {
          updateStatus("🟢 CANLI BAĞLI", "#a6e3a1");
          mqttClient.subscribe(TOPIC);
        });

        mqttClient.on('offline', () => {
          updateStatus("🔴 BAĞLANTI KOPTU", "#f38ba8");
        });

        mqttClient.on('error', (err) => {
          console.warn('MQTT Hatasi:', err);
          updateStatus("🟠 LOKAL MOD", "#f9e2af");
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data) {
              dailyTurnover = data.turnover || 0;
              tables = data.tables || createEmptyTables();
              salesHistory = data.history || [];
              quickProducts = data.quickProducts || [];
              
              updateTurnoverDisplay();
              renderGrids();
              renderHistoryDrawer();
              if (activeTableKey) {
                renderModalContent();
                renderQuickProducts();
              }
            }
          } catch (e) { console.error(e); }
        });
      } catch (e) {
        console.warn("WebSocket kısıtlaması nedeniyle lokal mod aktif:", e);
        updateStatus("🟠 LOKAL MOD", "#f9e2af");
      }
    }

    function syncData() {
      try {
        if (mqttClient && mqttClient.connected) {
          const payload = JSON.stringify({ 
            turnover: dailyTurnover, 
            tables: tables, 
            history: salesHistory,
            quickProducts: quickProducts 
          });
          mqttClient.publish(TOPIC, payload, { retain: true, qos: 0 });
        }
      } catch (e) {
        console.warn("MQTT Publish atlandı");
      }
      localStorage.setItem("cafe_turnover", dailyTurnover);
      localStorage.setItem("cafe_tables", JSON.stringify(tables));
      localStorage.setItem("cafe_history", JSON.stringify(salesHistory));
      localStorage.setItem("cafe_quick_products", JSON.stringify(quickProducts));
    }

    function updateTurnoverDisplay() {
      document.getElementById("daily-turnover").innerText = dailyTurnover + " TL";
    }

    function renderGrids() {
      renderGridSection("grid-left", "left", leftTableNames);
      renderGridSection("grid-right", "right", rightTableNames);
    }

    function renderGridSection(containerId, prefix, namesArray) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = "";

      for (let i = 1; i <= 12; i++) {
        const key = `${prefix}_${i}`;
        const tableName = namesArray[i - 1] || `Masa ${i}`;
        const total = (tables[key] || []).reduce((sum, item) => sum + (item.count * item.price), 0);

        const box = document.createElement("div");
        box.className = `table-box ${total > 0 ? 'has-orders' : ''}`;
        box.onclick = () => openModal(key, tableName);
        box.innerHTML = `
          <span>${tableName}</span>
          <span class="badge">${total} TL</span>
        `;
        grid.appendChild(box);
      }
    }

    function renderHistoryDrawer() {
      const listContainer = document.getElementById("drawer-history-list");
      listContainer.innerHTML = "";

      if (salesHistory.length === 0) {
        listContainer.innerHTML = `<p style="text-align:center; color:#a6adc8; margin-top:20px;">Henüz satış kaydı bulunmuyor.</p>`;
        return;
      }

      [...salesHistory].reverse().forEach(sale => {
        const card = document.createElement("div");
        card.className = "history-card";
        const methodClean = sale.method.replace(/\s+/g, "");

        card.innerHTML = `
          <div class="history-card-header">
            <span>${sale.table}</span>
            <span style="color:#a6e3a1;">+${sale.total} TL</span>
          </div>
          <div class="history-card-body">
            <span class="history-card-time">📅 ${sale.date} - 🕒 ${sale.time}</span>
            <span class="method-badge method-${methodClean}">${sale.method}</span>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function toggleDrawer(open) {
      const drawer = document.getElementById("side-drawer");
      const overlay = document.getElementById("drawer-overlay");
      if (open) {
        drawer.classList.add("active");
        overlay.classList.add("active");
      } else {
        drawer.classList.remove("active");
        overlay.classList.remove("active");
      }
    }

    function resetCari() {
      if (confirm("Günlük ciro (cari) sıfırlanacak. Emin misiniz?")) {
        dailyTurnover = 0;
        syncData();
        updateTurnoverDisplay();
      }
    }

    function resetHistory() {
      if (confirm("Satış günlüğü ve toplam ciro sıfırlanacak. Emin misiniz?")) {
        salesHistory = [];
        dailyTurnover = 0;
        syncData();
        renderHistoryDrawer();
        updateTurnoverDisplay();
      }
    }

    function openModal(key, titleText) {
      activeTableKey = key;
      document.getElementById("modal-title").innerText = titleText;
      document.getElementById("order-modal").classList.remove("hidden");
      renderModalContent();
      renderQuickProducts();
    }

    function closeModal() {
      document.getElementById("order-modal").classList.add("hidden");
      activeTableKey = null;
    }

    function renderModalContent() {
      if (!activeTableKey) return;

      const items = tables[activeTableKey] || [];
      const listContainer = document.getElementById("modal-item-list");
      listContainer.innerHTML = "";

      let total = 0;

      if (items.length === 0) {
        listContainer.innerHTML = `<p style="color: #a6adc8; text-align: center; margin: 15px 0; font-size: 13px;">Bu masada henüz sipariş yok.</p>`;
      } else {
        items.forEach((item, index) => {
          const itemTotal = item.count * item.price;
          total += itemTotal;

          const row = document.createElement("div");
          row.className = "item-row";
          row.innerHTML = `
            <span><strong>${item.name}</strong> (${item.count} x ${item.price}₺)</span>
            <div>
              <span style="color: #a6e3a1; font-weight: bold;">${itemTotal} TL</span>
              <button class="delete-btn" onclick="deleteItem(${index})">X</button>
            </div>
          `;
          listContainer.appendChild(row);
        });
      }

      document.getElementById("modal-total").innerText = `Toplam: ${total} TL`;
    }

    function renderQuickProducts() {
      const grid = document.getElementById("quick-product-grid");
      grid.innerHTML = "";

      if (quickProducts.length === 0) {
        grid.innerHTML = `<p style="color: #a6adc8; grid-column: span 2; text-align: center; font-size: 12px; margin: 15px 0;">Henüz hızlı ürün eklenmedi.</p>`;
        return;
      }

      quickProducts.forEach((prod, index) => {
        const card = document.createElement("div");
        card.className = "quick-card";
        card.onclick = () => addFromQuick(index);
        card.innerHTML = `
          <span class="quick-card-del" onclick="deleteQuickProduct(event, ${index})">✕</span>
          <span class="quick-card-name">${prod.name}</span>
          <span class="quick-card-price">${prod.price} TL</span>
        `;
        grid.appendChild(card);
      });
    }

    function addQuickProduct() {
      const nameInput = document.getElementById("quick-name");
      const priceInput = document.getElementById("quick-price");
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (!name || isNaN(price) || price < 0) return;

      quickProducts.push({ name, price });
      nameInput.value = "";
      priceInput.value = "";

      syncData();
      renderQuickProducts();
    }

    function deleteQuickProduct(event, index) {
      event.stopPropagation();
      quickProducts.splice(index, 1);
      syncData();
      renderQuickProducts();
    }

    function addFromQuick(index) {
      if (!activeTableKey) return;
      const prod = quickProducts[index];
      if (!prod) return;

      if (!tables[activeTableKey]) tables[activeTableKey] = [];
      tables[activeTableKey].push({ name: prod.name, count: 1, price: prod.price });

      syncData();
      renderModalContent();
    }

    function addItem() {
      if (!activeTableKey) return;

      const nameInput = document.getElementById("item-name");
      const countInput = document.getElementById("item-count");
      const priceInput = document.getElementById("item-price");

      const name = nameInput.value.trim();
      const count = parseInt(countInput.value);
      const price = parseFloat(priceInput.value);

      if (!name || isNaN(count) || isNaN(price) || count <= 0 || price < 0) return;

      if (!tables[activeTableKey]) tables[activeTableKey] = [];
      tables[activeTableKey].push({ name, count, price });

      nameInput.value = "";
      countInput.value = "1";
      priceInput.value = "";

      syncData();
      renderModalContent();
    }

    function deleteItem(index) {
      if (!activeTableKey) return;
      tables[activeTableKey].splice(index, 1);
      syncData();
      renderModalContent();
    }

    function completeSale(method) {
      if (!activeTableKey) return;

      const items = tables[activeTableKey] || [];
      const tableTotal = items.reduce((sum, item) => sum + (item.count * item.price), 0);

      if (tableTotal === 0) {
        alert("Masada sipariş bulunmuyor!");
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('tr-TR');
      const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      const tableLabel = getTableName(activeTableKey);
      const itemsSummary = items.map(i => `${i.name} (${i.count}x${i.price}TL)`).join(", ");

      const saleRecord = {
        date: dateStr,
        time: timeStr,
        table: tableLabel,
        method: method,
        total: tableTotal,
        itemsSummary: itemsSummary
      };

      salesHistory.push(saleRecord);
      dailyTurnover += tableTotal;
      tables[activeTableKey] = [];

      syncData();
      renderHistoryDrawer();
      closeModal();
    }

    function clearTable() {
      if (!activeTableKey) return;
      tables[activeTableKey] = [];
      syncData();
      renderModalContent();
    }

    // GÜNÜ TOPLA (ÖZET EXCEL / CSV RAPORU İNDİR)
    function exportDailySummaryExcel() {
      if (salesHistory.length === 0) {
        alert("Henüz bugün yapılmış bir satış kaydı bulunmuyor.");
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('tr-TR');
      const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      let nakitAdet = 0;
      let nakitToplam = 0;
      let kartAdet = 0;
      let kartToplam = 0;
      let yemekKartAdet = 0;
      let yemekKartToplam = 0;

      salesHistory.forEach(sale => {
        const method = (sale.method || "").trim();
        if (method === "Nakit") {
          nakitAdet++;
          nakitToplam += sale.total;
        } else if (method === "Kredi Kartı" || method === "KrediKartı") {
          kartAdet++;
          kartToplam += sale.total;
        } else if (method === "Yemek Kartı" || method === "YemekKartı") {
          yemekKartAdet++;
          yemekKartToplam += sale.total;
        }
      });

      const toplamKazanc = nakitToplam + kartToplam + yemekKartToplam;
      const toplamIslem = nakitAdet + kartAdet + yemekKartAdet;

      let csvContent = "\uFEFF";
      csvContent += "GÜN SONU KAFE ÖZET RAPORU\n";
      csvContent += `Rapor Tarihi;${dateStr}\n`;
      csvContent += `Rapor Saati;${timeStr}\n\n`;

      csvContent += "ÖDEME TÜRÜ;İŞLEM ADEDİ;TOPLAM TUTAR (TL)\n";
      csvContent += `Nakit;${nakitAdet};${nakitToplam} TL\n`;
      csvContent += `Kredi Kartı;${kartAdet};${kartToplam} TL\n`;
      csvContent += `Yemek Kartı;${yemekKartAdet};${yemekKartToplam} TL\n`;
      csvContent += `GENEL TOPLAM KAZANÇ;${toplamIslem};${toplamKazanc} TL\n\n`;

      csvContent += "DETAYLI SATIŞ LİSTESİ\n";
      csvContent += "Tarih;Saat;Masa;Ödeme Yöntemi;Tutar (TL);Sipariş Detayı\n";

      salesHistory.forEach(sale => {
        csvContent += `${sale.date};${sale.time};${sale.table};${sale.method};${sale.total};"${sale.itemsSummary}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", `Gun_Sonu_Raporu_${dateStr.replace(/\./g, '-')}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = initApp;
  </script>
</body>
